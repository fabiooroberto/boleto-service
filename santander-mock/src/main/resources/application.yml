spring:
  application:
    name: santander-mock
  data:
    mongodb:
      uri: mongodb://localhost:27017/santander_mock
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

server:
  port: 8081
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized
